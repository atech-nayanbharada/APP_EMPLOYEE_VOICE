{% load static %}
<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>Login | HR Sampark</title>
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta content="" name="description" />
        <meta content="" name="author" />
        {% include 'user/login/login_header.html'%}
        <style>
         body{
         font-family: adani regular!important;
         }
         .login-submit-button {
            background: #4E78A8;
            --bs-btn-hover-bg: #6A92B6;
            --bs-btn-active-bg: #6A92B6;
         }
        </style>
    </head>

    <body>
        <div class="auth-maintenance d-flex align-items-center min-vh-100">
            <div class="bg-overlay bg-light"></div>
            <div class="container">
                <div class="row justify-content-center">
                    <div class="col-md-10">
                        <div class="auth-full-page-content d-flex min-vh-100 py-sm-5 py-4">
                            <div class="w-100">
                                <div class="d-flex flex-column h-100 py-0 py-xl-3">
                                    <div class="text-center mb-4">
<!--                                        <a href="#" class="">-->
<!--                                            <img src="{% static 'new_design/assets/images/logo-dark.png' %}" alt="" height="22" class="auth-logo logo-dark mx-auto">-->
<!--                                            <img src="{% static 'new_design/assets/images/logo-light.png' %}" alt="" height="22" class="auth-logo logo-light mx-auto">-->
<!--                                        </a>-->
<!--                                        <p class="text-muted mt-2">User Experience & Interface Design Strategy Saas Solution</p>-->
                                    </div>

                                    <div class="card my-auto overflow-hidden">
                                            <div class="row g-0">
                                                <div class="col-lg-6">
                                                    <div class="bg-overlay bg-primary"></div>
                                                    <div class="h-100 bg-auth align-items-end" style="background-image: url('{% static 'new_design/login/images/login_modal.jpg' %}');">
                                                    </div>
                                                </div>

                                                <div class="col-lg-6">
                                                    <div class="p-lg-5 p-4">
                                                        <div>
                                                            <div class="text-center mt-1">
                                                                <h4 class="font-size-18">Welcome Back !</h4>
                                                                <p class="text-muted">Sign in to continue to HR Sampark.</p>
                                                            </div>

                                                            <form method="post" class="auth-input">
                                                                {% csrf_token %}
                                                                <div class="mb-2">
                                                                    <label for="email" class="form-label">Email</label>
                                                                    <input type="email" required class="form-control" name="email" id="email" placeholder="Enter Your Email">
                                                                </div>
                                                                <div class="mb-3">
                                                                    <label class="form-label" for="password-input">Password</label>
                                                                    <input type="password" id="password-input" required name="password" class="form-control" placeholder="Enter password">
                                                                </div>
                                                                <div class="form-check">
<!--                                                                    <input class="form-check-input" type="checkbox" value="" id="auth-remember-check">-->
                                                                    <label class="form-check-label" for="auth-remember-check"> </label>
                                                                </div>
                                                                <div class="mt-6">
                                                                    <button class="btn btn-primary w-100 login-submit-button" type="submit">Sign In</button>
                                                                    <br>
                                                                    <button class="btn btn-primary w-100 login-submit-button" style="margin-top: 5px;" type="reset">Clear</button>
                                                                </div>

                                                                <div class="mt-4 pt-2 text-center">
                                                                    <div class="signin-other-title">
<!--                                                                        <h5 class="font-size-14 mb-4 title">Sign In with</h5>-->
                                                                    </div>
                                                                    <div class="pt-2 hstack gap-2 justify-content-center">

<!--                                                                        <button type="button" class="btn btn-primary btn-sm"><i class="ri-facebook-fill font-size-16"></i></button>-->
<!--                                                                        <button type="button" class="btn btn-danger btn-sm"><i class="ri-google-fill font-size-16"></i></button>-->
<!--                                                                        <button type="button" class="btn btn-dark btn-sm"><i class="ri-github-fill font-size-16"></i></button>-->
<!--                                                                        <button type="button" class="btn btn-info btn-sm"><i class="ri-twitter-fill font-size-16"></i></button>-->
                                                                    </div>
                                                                </div>
                                                            </form>
                                                        </div>

                                                        <div class="mt-4 text-center">
                                                            <p class="mb-0"> <a href="auth-register.html" class="fw-medium text-primary">  </a> </p>
                                                        </div>
                                                    </div>
                                                </div>
                                        </div>
                                    </div>
                                    <!-- end card -->

                                    <div class="mt-5 text-center">
<!--                                        <p class="mb-0">© <script>document.write(new Date().getFullYear())</script> Tocly. Crafted with <i class="mdi mdi-heart text-danger"></i> by Themesdesign</p>-->
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- end col -->
                </div>
                <!-- end row -->
            </div>
        </div>
        {% include 'user/login/login_footer.html' %}
        {% include 'common/message.html' %}
    </body>
</html>
